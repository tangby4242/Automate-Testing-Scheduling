name: Submit Microsoft Form from Excel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'  # optional: daily at 01:00 UTC (adjust or remove)

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies and browsers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Microsoft Form submitter
        env:
          # Config.yml contains form_url and excel_path per Option B.
          # If your SharePoint Excel requires authentication, add EXCEL_BEARER_TOKEN as a repository secret.
          EXCEL_BEARER_TOKEN: ${{ secrets.EXCEL_BEARER_TOKEN }}
        run: |
          python main_msforms.py

      - name: Upload processed results
        uses: actions/upload-artifact@v4
        with:
          name: processed-results
          path: processed.csv